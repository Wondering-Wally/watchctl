[package]
name = "watchctl"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
description = "Command-line client and daemon for the apple_watch_connector Linux backend"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
libc = "0.2"
serde_json = "1.0"
watch-protocol = { git = "https://github.com/LordixDemon/apple_watch_connector", rev = "6485f975" }
watch-transport-linux = { git = "https://github.com/LordixDemon/apple_watch_connector", rev = "6485f975" }
zbus = "4"

[[bin]]
name = "watchctld"
path = "src/bin/watchctld.rs"

[[bin]]
name = "watchctl"
path = "src/main.rs"
